<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="doc-version" content="{{版本}}">
  <title>{{主题}} 开发文档</title>
</head>
<body>
  <main>
    <h1>{{主题}} 开发文档</h1>
    <ul>
      <li>文档版本：{{版本}}</li>
      <li>创建日期：{{创建时间}}</li>
      <li>状态：{{状态}}</li>
    </ul>
    <h2>目标与范围</h2>
    <p>{{描述开发目标、交付范围和不包含的内容}}</p>
    <h2>实现方案</h2>
    <p>{{说明模块划分、关键逻辑和技术选型}}</p>
    <h2>配置与依赖</h2>
    <p>{{记录所需配置、依赖和环境要求}}</p>
    <h2>开发步骤</h2>
    <p>{{列出实现步骤及关键注意事项}}</p>
    <h2>测试与验收</h2>
    <p>{{说明测试用例、执行命令和验收标准}}</p>
    <h2>发布与回滚</h2>
    <p>{{说明发布步骤、监控项和回滚方法}}</p>
    <h2>已知问题</h2>
    <p>{{记录限制和后续事项}}</p>
  </main>
</body>
</html>
