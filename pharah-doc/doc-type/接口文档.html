<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="doc-version" content="{{版本}}">
  <title>{{主题}} 接口文档</title>
</head>
<body>
  <main>
    <h1>{{主题}} 接口文档</h1>
    <ul>
      <li>文档版本：{{版本}}</li>
      <li>创建日期：{{创建时间}}</li>
      <li>接口版本：{{接口版本}}</li>
      <li>状态：{{状态}}</li>
    </ul>
    <h2>接口概述</h2>
    <p>{{说明接口用途、调用方和认证方式}}</p>
    <h2>请求</h2>
    <p>方法与路径：{{HTTP 方法与路径}}</p>
    <p>Content-Type：{{请求类型}}</p>
    <h3>请求头</h3>
    <p>{{列出请求头名称、类型、是否必填及说明}}</p>
    <h3>请求参数</h3>
    <p>{{列出参数名称、位置、类型、是否必填及说明}}</p>
    <h2>响应</h2>
    <pre><code>{{填写成功响应示例}}</code></pre>
    <h2>错误码</h2>
    <p>{{列出错误码、HTTP 状态码、说明和处理建议}}</p>
    <h2>示例与注意事项</h2>
    <p>{{提供调用示例、幂等性和限流等说明}}</p>
  </main>
</body>
</html>
