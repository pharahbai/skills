<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="doc-version" content="{{版本}}">
  <title>{{主题}} 设计文档</title>
</head>
<body>
  <main>
    <h1>{{主题}} 设计文档</h1>
    <ul>
      <li>文档版本：{{版本}}</li>
      <li>创建日期：{{创建时间}}</li>
      <li>状态：{{状态}}</li>
    </ul>
    <h2>背景与目标</h2>
    <p>{{描述问题背景、设计目标和范围}}</p>
    <h2>需求与约束</h2>
    <p>{{列出功能需求、非功能需求及技术约束}}</p>
    <h2>总体方案</h2>
    <p>{{说明方案选择、核心流程及关键决策}}</p>
    <h2>详细设计</h2>
    <p>{{描述模块、数据模型、接口和异常处理}}</p>
    <h2>安全与兼容性</h2>
    <p>{{说明权限、数据保护、兼容性和迁移考虑}}</p>
    <h2>验证方案</h2>
    <p>{{列出测试策略、验收标准和回滚方案}}</p>
    <h2>待确认事项</h2>
    <p>{{列出尚未决策的问题}}</p>
  </main>
</body>
</html>
