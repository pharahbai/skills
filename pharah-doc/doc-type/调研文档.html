<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="doc-version" content="{{版本}}">
  <title>{{主题}} 调研文档</title>
</head>
<body>
  <main>
    <h1>{{主题}} 调研文档</h1>
    <ul>
      <li>文档版本：{{版本}}</li>
      <li>创建日期：{{创建时间}}</li>
      <li>调研范围：{{调研范围}}</li>
      <li>状态：{{状态}}</li>
    </ul>
    <h2>背景与目标</h2>
    <p>{{说明调研背景、待解决的问题和调研目标}}</p>
    <h2>调研问题</h2>
    <p>{{列出需要回答的关键问题}}</p>
    <h2>调研过程与资料来源</h2>
    <p>{{记录调研方法、资料来源及其可靠性}}</p>
    <h2>发现与分析</h2>
    <p>{{整理关键发现、证据和影响}}</p>
    <h2>结论与建议</h2>
    <p>{{给出结论、建议方案及待确认事项}}</p>
    <h2>参考资料</h2>
    <p>{{列出引用资料及链接}}</p>
  </main>
</body>
</html>
